[project]
name = "tooktac-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2.0",
    # Database
    "sqlalchemy>=2.0.42",
    "pymysql>=1.1.1",
    # Auth
    "python-jose[cryptography]>=3.5.0",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "email-validator>=2.2.0",
    # AI - LLM (LangChain/LangGraph — openai/google-genai SDK는 전이 의존성)
    "langchain-core>=1.4.8",
    "langchain-google-genai>=4.2.6",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.7",
    # AI - Vision
    "mediapipe>=0.10.9,<0.10.20",
    "opencv-contrib-python>=4.12.0.88",
    # AI - NLP
    "sentence-transformers>=5.0.0",
    "transformers>=4.54.1",
    "torch>=2.7.1",
    # AI - STT (실전 면접의 SenseVoice 로컬 추론)
    "funasr>=1.2.0",
    "torchaudio>=2.7.1",
    # Audio
    "librosa>=0.11.0",
    "sounddevice>=0.5.2",
    "soundfile>=0.13.1",
    "numba>=0.61.0",
    "llvmlite>=0.44.0",
    # Data
    "numpy>=2.2.6",
    "pandas>=2.3.1",
    "scikit-learn>=1.7.1",
    "pillow>=11.3.0",
    # HTTP
    "requests>=2.32.4",
    "httpx>=0.28.1",
    "alembic>=1.18.5",
    "bcrypt>=5.0.0",
]

[tool.uv]
package = false

# torch를 어디서 받을지 못 박는다.
#
# 리눅스의 PyPI torch 휠에는 CUDA가 들어 있다. 그래서 배포 서버와 CI는 그대로 두면 된다.
# Windows의 PyPI 휠은 CPU 전용이다. 그냥 두면 SenseVoice가 CPU로 떨어져 STT가 수십 배
# 느려지고, 꼬리질문이 준비 시간(10초) 예산을 넘긴다.
#
# 여기에 안 박아두면 uv run/uv sync가 실행할 때마다 CPU 휠로 되돌린다 — 실제로 겪었다.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
